name: Release

# Push a tag to release:  git tag v0.1.0 && git push origin v0.1.0
# Builds binaries for macOS, Linux and Windows, creates the GitHub release and
# updates the cask in jverhoeks/homebrew-tap (needs the HOMEBREW_TAP_TOKEN
# secret: a token with write access to that repo).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
